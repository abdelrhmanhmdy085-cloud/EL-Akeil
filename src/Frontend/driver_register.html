<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="driver_register_title">تسجيل الطيار - الأكيل</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">
    <style>
        .auth-container {
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #FFEAEA 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .auth-card {
            background: white;
            border-radius: 20px;
            padding: 3rem 2rem;
            box-shadow: 0 10px 40px rgba(94, 33, 41, 0.15);
            max-width: 600px;
            width: 100%;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .auth-header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }

        .form-input {
            width: 100%;
            padding: 0.9rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            color: var(--text-primary);
            background: var(--bg-hover);
            transition: border-color 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
        }

        .form-input::placeholder {
            color: var(--text-secondary);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .form-row .form-group {
            margin-bottom: 1.5rem;
        }

        .btn-submit {
            width: 100%;
            padding: 1rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 1rem;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(94, 33, 41, 0.2);
        }

        .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .auth-footer a:hover {
            color: var(--primary-hover);
        }

        .back-link {
            display: inline-block;
            margin-bottom: 1rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--primary);
        }

        .error-message {
            color: var(--danger);
            font-size: 0.85rem;
            margin-top: 0.3rem;
            display: none;
        }

        .form-input.error {
            border-color: var(--danger);
        }

        .driver-icon {
            font-size: 3rem;
            text-align: center;
            margin-bottom: 1rem;
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 2rem 1.5rem;
            }

            .auth-header h1 {
                font-size: 1.5rem;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <a href="index.html" class="back-link">← العودة للرئيسية</a>

            <div class="auth-header">
                <div class="driver-icon">🛵</div>
                <h1 data-i18n="driver_register_title">تسجيل الطيار</h1>
                <p data-i18n="join_driver_desc">وصل الطلبات وزود دخلك</p>
            </div>

            <form id="driverRegisterForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="driver-fullname" class="form-label" data-i18n="full_name">الاسم الكامل</label>
                        <input id="driver-fullname" type="text" name="fullName" class="form-input" required>
                        <span class="error-message" data-i18n="error_required">هذا الحقل مطلوب</span>
                    </div>
                    <div class="form-group">
                        <label for="driver-email" class="form-label" data-i18n="email_label">البريد الإلكتروني</label>
                        <input id="driver-email" type="email" name="email" class="form-input" required>
                        <span class="error-message" data-i18n="error_email">بريد إلكتروني غير صحيح</span>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="driver-password" class="form-label" data-i18n="pass_label">كلمة المرور</label>
                        <input id="driver-password" type="password" name="password" class="form-input" required>
                        <span class="error-message" data-i18n="error_password">كلمة المرور قصيرة جداً (8 أحرف على الأقل)</span>
                    </div>
                    <div class="form-group">
                        <label for="driver-confirm-password" class="form-label" data-i18n="valid_pass_confirm">تأكيد كلمة المرور</label>
                        <input id="driver-confirm-password" type="password" name="confirmPassword" class="form-input" required>
                        <span class="error-message" data-i18n="pass_mismatch">كلمة المرور غير متطابقة!</span>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="driver-vehicle" class="form-label" data-i18n="driver_vehicle">نوع السيارة</label>
                        <select id="driver-vehicle" name="vehicleType" class="form-input" required>
                            <option value="">اختر نوع السيارة</option>
                            <option value="motorcycle">دراجة نارية</option>
                            <option value="scooter">سكوتر</option>
                            <option value="car">سيارة</option>
                        </select>
                        <span class="error-message" data-i18n="error_required">هذا الحقل مطلوب</span>
                    </div>
                    <div class="form-group">
                        <label for="driver-license" class="form-label" data-i18n="driver_license">رقم رخصة القيادة</label>
                        <input id="driver-license" type="text" name="licenseNumber" class="form-input" required>
                        <span class="error-message" data-i18n="error_required">هذا الحقل مطلوب</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="driver-national-id" class="form-label" data-i18n="national_id">الرقم القومي</label>
                    <input id="driver-national-id" type="text" name="nationalId" class="form-input" pattern="[0-9]{14}" required>
                    <span class="error-message" data-i18n="error_national_id">الرقم القومي يجب أن يكون 14 رقم</span>
                </div>

                <div class="form-group">
                    <label for="driver-phone" class="form-label" data-i18n="phone">رقم الهاتف</label>
                    <input id="driver-phone" type="tel" name="phoneNumber" class="form-input" pattern="[0-9]{10,11}" required>
                    <span class="error-message" data-i18n="error_required">رقم هاتف صحيح مطلوب</span>
                </div>

                <button type="submit" class="btn-submit" data-i18n="btn_register">تسجيل</button>
            </form>

            <div class="auth-footer">
                <span data-i18n="already_have_account">هل لديك حساب؟</span>
                <a href="driver_login.html" data-i18n="btn_login">دخول</a>
            </div>
        </div>
    </div>

    <script src="assets/js/common.js"></script>
    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('driverRegisterForm');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const fullName = form.fullName.value;
                const email = form.email.value;
                const password = form.password.value;
                const confirmPassword = form.confirmPassword.value;
                const vehicleType = form.vehicleType.value;
                const licenseNumber = form.licenseNumber.value;
                const nationalId = form.nationalId.value;
                const phoneNumber = form.phoneNumber.value;

                // Validation
                if (password !== confirmPassword) {
                    alert('كلمات المرور غير متطابقة!');
                    return;
                }

                if (password.length < 8) {
                    alert('كلمة المرور يجب أن تكون 8 أحرف على الأقل');
                    return;
                }

                if (nationalId.length !== 14) {
                    alert('الرقم القومي يجب أن يكون 14 رقم');
                    return;
                }

                if (phoneNumber.length < 10) {
                    alert('رقم الهاتف غير صحيح');
                    return;
                }

                try {
                    const submitBtn = form.querySelector('.btn-submit');
                    submitBtn.disabled = true;
                    submitBtn.textContent = 'جاري التسجيل...';

                    // API Call
                    const response = await fetch('/api/driver-register', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            fullName,
                            email,
                            password,
                            vehicleType,
                            licenseNumber,
                            nationalId,
                            phoneNumber,
                            role: 'driver'
                        })
                    });

                    const result = await response.json();

                    if (response.ok) {
                        localStorage.setItem('token', result.token);
                        localStorage.setItem('user', JSON.stringify(result.user));
                        localStorage.setItem('user_role', 'driver');
                        alert('تم التسجيل بنجاح! جاري نقلك إلى لوحتك...');
                        window.location.href = 'driver.html';
                    } else {
                        alert('خطأ في التسجيل: ' + (result.message || 'حاول مرة أخرى'));
                    }
                } catch (error) {
                    console.error('Registration error:', error);
                    alert('حدث خطأ في التسجيل');
                } finally {
                    const submitBtn = form.querySelector('.btn-submit');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'تسجيل';
                }
            });
        });
    </script>
</body>

</html>
