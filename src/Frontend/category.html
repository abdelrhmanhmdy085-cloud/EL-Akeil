<!DOCTYPE html>
<html lang="ar" dir="rtl" id="mainHtml">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="category_detail_title">تفاصيل الفئة - El Akeil</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body.ltr {
            direction: ltr;
            text-align: left;
        }

        body.rtl {
            direction: rtl;
            text-align: right;
        }

        .page-header {
            background: linear-gradient(135deg, #FF5A00 0%, #FF8C42 100%);
            color: white;
            padding: 30px 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .page-header-icon {
            font-size: 80px;
            line-height: 1;
        }

        .page-header-content h1 {
            margin: 0 0 10px 0;
            font-size: 2rem;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
        }

        .page-header-content p {
            margin: 0;
            font-size: 0.95rem;
            opacity: 0.9;
            font-family: 'Inter', sans-serif;
        }

        .back-button {
            position: absolute;
            top: 75px;
            left: 20px;
            background: rgba(255, 255, 255, 0.3);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .back-button:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        body.ltr .back-button {
            left: auto;
            right: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px 40px 15px;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 30px 0 20px 0;
            color: #333;
            font-family: 'Cairo', sans-serif;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title-icon {
            font-size: 1.8rem;
        }

        .dishes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .dish-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .dish-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(255, 90, 0, 0.15);
        }

        .dish-card-image {
            width: 100%;
            height: 180px;
            background: linear-gradient(135deg, #FF5A00 0%, #FF8C42 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: white;
        }

        .dish-card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .dish-card-content {
            padding: 15px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .dish-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 8px;
        }

        .dish-card-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #333;
            font-family: 'Cairo', sans-serif;
            flex: 1;
        }

        .dish-card-level {
            background: #FF5A00;
            color: white;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            white-space: nowrap;
            font-family: 'Inter', sans-serif;
        }

        .dish-card-chef {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 8px;
            font-family: 'Inter', sans-serif;
        }

        .dish-card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 10px;
            border-top: 1px solid #eee;
        }

        .dish-card-price {
            font-size: 1.2rem;
            font-weight: 700;
            color: #FF5A00;
            font-family: 'Inter', sans-serif;
        }

        .dish-card-rating {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.9rem;
            color: #FFA500;
            font-family: 'Inter', sans-serif;
        }

        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 300px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #FF5A00;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .empty-state-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: #666;
        }

        .empty-state-text {
            font-size: 1rem;
            color: #999;
        }

        .navbar {
            background: #FF5A00;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .navbar-left {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .navbar-brand {
            font-size: 1.3rem;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
        }

        .navbar-button {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            transition: all 0.3s;
        }

        .navbar-button:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .lang-selector {
            padding: 8px 12px;
            border-radius: 8px;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
        }

        .lang-selector option {
            background: #FF5A00;
            color: white;
        }

        @media (max-width: 768px) {
            .dishes-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 15px;
            }

            .page-header {
                flex-direction: column;
                text-align: center;
            }

            .page-header-icon {
                font-size: 60px;
            }

            .page-header-content h1 {
                font-size: 1.5rem;
            }

            .back-button {
                top: 15px;
            }

            .navbar {
                flex-direction: column;
                gap: 10px;
            }

            .navbar-left {
                width: 100%;
                justify-content: space-between;
            }
        }
    </style>
</head>

<body class="rtl">
    <!-- Navbar -->
    <div class="navbar">
        <div class="navbar-left">
            <span class="navbar-brand">الأكيل</span>
            <button class="navbar-button" onclick="goHome()" data-i18n="home_button">الرئيسية</button>
            <button class="navbar-button" onclick="goCategories()" data-i18n="all_categories">جميع الفئات</button>
        </div>
        <div id="langControls">
            <select class="lang-selector" onchange="loadLanguage(this.value)"></select>
        </div>
    </div>

    <!-- Back Button -->
    <button class="back-button" onclick="goCategories()" title="رجوع" aria-label="رجوع" data-i18n-title="back" data-i18n-aria-label="back">←</button>

    <!-- Page Header -->
    <div class="page-header" id="pageHeader">
        <div class="page-header-icon" id="categoryIcon">🍽️</div>
        <div class="page-header-content">
            <h1 id="categoryName">جاري التحميل...</h1>
            <p id="categoryDesc"></p>
        </div>
    </div>

    <!-- Content -->
    <div class="container">
        <div id="contentArea"></div>
    </div>

    <script src="assets/js/common.js"></script>
    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        function getUrlParam(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name);
        }

        async function loadCategoryDetail() {
            const categoryId = getUrlParam('id');
            if (!categoryId) {
                alert('Category not found');
                window.location.href = 'categories.html';
                return;
            }

            const lang = localStorage.getItem(LANG_KEY) || DEFAULT_LANG;
            const contentArea = document.getElementById('contentArea');

            try {
                const res = await fetch(`${API_BASE}/browse/category/${categoryId}?lang=${lang}`);
                if (!res.ok) throw new Error('Failed to load category');

                const category = await res.json();

                // Update header
                document.getElementById('categoryIcon').textContent = category.icon || '🍽️';
                document.getElementById('categoryName').textContent = category.name;

                // Display sections
                const groupedByLevel = category.grouped_by_level || {};
                
                if (Object.keys(groupedByLevel).length === 0) {
                    contentArea.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">🍽️</div>
                            <h2 class="empty-state-title" data-i18n="no_dishes">لا توجد أطباق</h2>
                            <p class="empty-state-text" data-i18n="no_dishes_desc">لا توجد أطباق في هذه الفئة حالياً</p>
                        </div>
                    `;
                    applyTranslations(lang);
                    return;
                }

                contentArea.innerHTML = '';

                Object.entries(groupedByLevel).forEach(([levelName, dishes]) => {
                    const section = document.createElement('div');
                    
                    const title = document.createElement('div');
                    title.className = 'section-title';
                    title.innerHTML = `
                        <span class="section-title-icon">📍</span>
                        <span>${levelName}</span>
                    `;
                    section.appendChild(title);

                    const grid = document.createElement('div');
                    grid.className = 'dishes-grid';

                    dishes.forEach(dish => {
                        const card = createDishCard(dish, lang);
                        grid.appendChild(card);
                    });

                    section.appendChild(grid);
                    contentArea.appendChild(section);
                });

            } catch (error) {
                console.error('Error loading category:', error);
                contentArea.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">❌</div>
                        <h2 class="empty-state-title" data-i18n="error_loading">خطأ في التحميل</h2>
                        <p class="empty-state-text" data-i18n="try_again">يرجى المحاولة مجدداً</p>
                    </div>
                `;
                applyTranslations(lang);
            }
        }

        function createDishCard(dish, lang) {
            const card = document.createElement('div');
            card.className = 'dish-card';

            card.innerHTML = `
                <div class="dish-card-image">${dish.image_url ? `<img src="${dish.image_url}" alt="${dish.name}">` : '🍲'}</div>
                <div class="dish-card-content">
                    <div class="dish-card-header">
                        <div class="dish-card-name">${dish.name}</div>
                        ${dish.level_name ? `<div class="dish-card-level">${dish.level_name}</div>` : ''}
                    </div>
                    <div class="dish-card-chef">👨‍🍳 ${dish.chef_name || 'Unknown Chef'}</div>
                    <div class="dish-card-footer">
                        <div class="dish-card-price">${dish.price} EGP</div>
                        <div class="dish-card-rating">⭐ ${dish.rating || 0}</div>
                    </div>
                </div>
            `;

            return card;
        }

        function goHome() {
            window.location.href = 'index.html';
        }

        function goCategories() {
            window.location.href = 'categories.html';
        }

        // Initialize on page load
        function init() {
            initLanguage();
            loadCategoryDetail();
        }

        window.addEventListener('load', init);
        window.addEventListener('languageChanged', () => {
            const lang = localStorage.getItem(LANG_KEY) || DEFAULT_LANG;
            loadCategoryDetail();
        });
    </script>
</body>

</html>
