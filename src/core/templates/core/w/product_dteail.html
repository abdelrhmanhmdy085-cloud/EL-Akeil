{% extends "core/base.html" %}
{% block content %}
<div class="row">
  <div class="col-md-6">
    {% if product.image %}
      <img src="{{ product.image.url }}" class="img-fluid rounded" alt="{{ product.name }}">
    {% endif %}
  </div>
  <div class="col-md-6">
    <h3>{{ product.name }}</h3>
    <p class="text-muted">{{ product.cook_name }}</p>
    <p>{{ product.description }}</p>
    <p class="fw-bold">{{ product.price }} جنيه</p>

    {% if user.is_authenticated %}
      <form method="post" action="{% url 'core:add_to_cart' product.pk %}">
        {% csrf_token %}
        <div class="input-group mb-3" style="max-width:140px;">
          <input type="number" name="quantity" class="form-control" value="1" min="1">
          <button class="btn btn-success">أضف للسلة</button>
        </div>
      </form>
    {% else %}
      <a class="btn btn-primary" href="{% url 'login' %}?next={{ request.path }}">سجل / دخول للشراء</a>
    {% endif %}
  </div>
</div>
{% endblock %}
