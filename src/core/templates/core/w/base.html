<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>الاكيل</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
      <div class="container">
        <a class="navbar-brand" href="{% url 'core:home' %}">الاكيل</a>
        <div class="d-flex">
          <a class="btn btn-outline-primary me-2" href="{% url 'core:cart' %}">السلة</a>
          {% if user.is_authenticated %}
            <span class="navbar-text me-2">مرحباً، {{ user.username }}</span>
            <a class="btn btn-outline-secondary" href="{% url 'admin:logout' %}">خروج</a>
          {% else %}
            <a class="btn btn-primary" href="{% url 'login' %}?next={{ request.path }}">تسجيل / دخول</a>
          {% endif %}
        </div>
      </div>
    </nav>

    <main class="container py-4">
      {% if messages %}
        <div class="mb-3">
          {% for msg in messages %}
            <div class="alert alert-{{ msg.tags }} small">{{ msg }}</div>
          {% endfor %}
        </div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>

    <footer class="text-center py-3">
      <small class="text-muted">© الاكيل</small>
    </footer>
  </body>
</html>
